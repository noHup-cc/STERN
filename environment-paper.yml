# The environment of the paper's feature extraction (bit-identical features for mouse / heart).
# CUDA 11.1 build of PyTorch 1.8.0; CPU-only machines: replace cudatoolkit by cpuonly.
# Nothing here may upgrade Pillow 5.4.1 (it decodes and resizes the slices); imageio is therefore left out.
name: stern-paper
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.7.12
  - pytorch=1.8.0
  - torchvision=0.9.0
  - cudatoolkit=11.1
  - numpy=1.21.5
  - pillow=5.4.1
  - scikit-learn=1.0.2
  - scipy=1.7.3
  - pip
  - pip:
      - timm==0.6.13
      - opencv-contrib-python==4.6.0.66
      - tifffile==2021.7.2
      - safetensors==0.3.1
      - pytest==7.4.4
      - -e .
